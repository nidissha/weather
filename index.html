<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast AI | Live Weather Predictor</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #74ebd5, #ACB6E5); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 360px; text-align: center; display: none; }
        h1 { font-size: 24px; color: #333; margin-bottom: 5px; }
        p.subtitle { color: #0284c7; font-size: 15px; font-weight: bold; margin-bottom: 20px; }
        .info-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; margin: 15px 0; text-align: left; }
        .info-item { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; color: #475569; }
        .result-box { margin-top: 15px; padding: 15px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; border-radius: 10px; font-weight: bold; font-size: 18px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: white; padding: 25px; border-radius: 16px; text-align: center; width: 320px; }
        .btn-allow { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
    </style>
</head>
<body>

<div id="location-modal" class="modal-overlay">
    <div class="modal-box">
        <h2>📍 Enable Location</h2>
        <p>Allow location access to predict live weather instantly.</p>
        <button class="btn-allow" onclick="getAutoPrediction()">Allow & Predict Weather</button>
    </div>
</div>

<div id="app-card" class="card">
    <h1>🌤️ SkyCast AI</h1>
    <p class="subtitle" id="city-name">📍 Fetching Location...</p>

    <div class="info-box">
        <div class="info-item"><span>Temperature:</span> <strong id="val-temp">-- °C</strong></div>
        <div class="info-item"><span>Humidity:</span> <strong id="val-humidity">-- %</strong></div>
        <div class="info-item"><span>Wind Speed:</span> <strong id="val-wind">-- km/h</strong></div>
    </div>

    <div id="result" class="result-box">⚡ Fetching Live Prediction...</div>
</div>

<script>
    function getAutoPrediction() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(sendLocation, showError, { timeout: 5000 });
        } else {
            alert("Geolocation not supported!");
        }
    }

    function sendLocation(position) {
        document.getElementById("location-modal").style.display = "none";
        document.getElementById("app-card").style.display = "block";

        fetch('/predict_auto', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                lat: position.coords.latitude,
                lon: position.coords.longitude
            })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById("city-name").innerText = `📍 Location: ${data.city}`;
            document.getElementById("val-temp").innerText = `${data.temp} °C`;
            document.getElementById("val-humidity").innerText = `${data.humidity} %`;
            document.getElementById("val-wind").innerText = `${data.wind} km/h`;
            document.getElementById("result").innerText = `Prediction: ${data.prediction}`;
        })
        .catch(err => {
            document.getElementById("result").innerText = "Prediction: Cloudy";
        });
    }

    function showError(err) {
        alert("Location permission required for auto prediction.");
    }
</script>

</body>
</html>
